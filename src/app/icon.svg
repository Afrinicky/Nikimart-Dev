<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1076 1076">
  <!--
    Tab icon. Browsers draw this at 16-32px, where an orange mark on nothing
    has no mass and disappears into the tab strip, so the weighting inverts
    here on purpose: a solid orange tile with the mark knocked out in white.
    Same trick Jumia's favicon uses, and the same reason.
  -->
  <rect width="1076" height="1076" rx="232" fill="#FF6A00"/>
  <g fill="#FFFFFF" transform="translate(0 140)">
    <path d="M392 28 L516 28 L589 329 L632 129 L756 129 L814 399 L924 129 L1048 129 L857 599 L733 599 L694 416 L654 599 L530 599 Z"/>
    <rect x="28" y="28" width="402" height="74" rx="25"/>
    <rect x="28" y="234" width="209" height="50" rx="25"/>
    <rect x="87" y="364" width="205" height="50" rx="25"/>
    <rect x="147" y="494" width="200" height="50" rx="25"/>
    <circle cx="592" cy="707" r="60"/>
    <circle cx="795" cy="707" r="60"/>
  </g>
</svg>
